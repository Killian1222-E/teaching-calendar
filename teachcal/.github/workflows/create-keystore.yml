name: 建立簽名金鑰

# 只需要跑一次。
# 產生的金鑰會放在 Artifacts 裡（不會出現在日誌），
# 下載後照裡面的 README 把三個 secrets 設好，
# 之後每次建置出來的 APK 就都是同一個簽名，可以直接覆蓋更新。

on:
  workflow_dispatch:
    inputs:
      alias:
        description: '金鑰別名'
        required: true
        default: teachcal
      password:
        description: '金鑰密碼（至少 6 碼，自己記好）'
        required: true

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 產生金鑰
        run: |
          mkdir -p out
          keytool -genkeypair -v \
            -keystore out/release.keystore \
            -alias "${{ inputs.alias }}" \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass "${{ inputs.password }}" \
            -keypass "${{ inputs.password }}" \
            -dname "CN=TeachCal, OU=Personal, O=Personal, L=Kaohsiung, S=Taiwan, C=TW"
          base64 -w0 out/release.keystore > out/KEYSTORE_BASE64.txt

      - name: 寫下操作說明
        run: |
          cat > out/README.txt <<'EOF'
          這個資料夾裡有三個東西：
            release.keystore      ← 你的簽名金鑰，請自己另外備份一份，弄丟就無法覆蓋更新了
            KEYSTORE_BASE64.txt   ← 金鑰的 base64 文字

          請到 GitHub 專案頁面：
            Settings → Secrets and variables → Actions → New repository secret

          新增這三個（名稱要一模一樣）：
            KEYSTORE_BASE64    貼上 KEYSTORE_BASE64.txt 的全部內容
            KEYSTORE_PASSWORD  你剛才輸入的密碼
            KEY_ALIAS          你剛才輸入的別名
            KEY_PASSWORD       同 KEYSTORE_PASSWORD

          設定完成後，回到 Actions → 「建置 Android APK」→ Run workflow，
          之後產生的 APK 就是正式簽名版了。

          設好之後，建議把這個下載的資料夾從電腦上刪掉，只留自己的備份。
          EOF
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: out/
          retention-days: 1
